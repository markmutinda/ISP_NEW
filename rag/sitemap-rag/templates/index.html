<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sallie Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    .chat-widget-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 9999;
      font-size: 18px;
    }

    .chatbox {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 320px;
      max-height: 80vh;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 10000;
    }

    .chatbox.fullscreen {
      width: 100vw;
      height: 100vh;
      bottom: 0;
      right: 0;
      border-radius: 0;
      max-height: none;
    }

    .chat-header {
      background: #2a2a2a;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .chat-header span {
      font-weight: bold;
    }

    .close-chat {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 14px;
    }

    .chat-loader {
      display: none;
      padding: 8px 15px;
      font-size: 13px;
      color: #bbb;
      font-style: italic;
      border-top: 1px solid #333;
    }

    .dot {
      animation: blink 1.2s infinite;
      margin-left: 2px;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .chat-input-area {
      display: flex;
      align-items: center;
      border-top: 1px solid #333;
      padding: 10px;
      background-color: #1e1e1e;
    }

    .chat-input-area input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
      background: #333;
      color: white;
    }

    .chat-input-area button {
      padding: 8px 12px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .message {
      margin-bottom: 10px;
    }

    .message.user {
      text-align: right;
    }

    .message.sallie {
      text-align: left;
      color: #b3e5fc;
    }

    pre, code {
      background: #2e2e2e;
      color: #ccc;
      padding: 4px 6px;
      border-radius: 4px;
      overflow-x: auto;
      display: block;
    }

    @media (max-width: 768px) {
      .chatbox {
        width: 100vw;
        height: 100vh;
        bottom: 0;
        right: 0;
        border-radius: 0;
        max-height: none;
      }
    }
  </style>
</head>
<body>

<button class="chat-widget-button" id="chat-toggle">💬</button>

<div class="chatbox" id="chatbox">
  <div class="chat-header">
    <span>Sallie 💬</span>
    <button class="close-chat" onclick="toggleChat()">✕</button>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="chat-loader" id="chat-loader">Sallie is typing<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>

  <div class="chat-input-area">
    <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off"/>
    <button id="send-btn">Send</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const chatToggle = document.getElementById("chat-toggle");
  const chatbox = document.getElementById("chatbox");
  const messagesContainer = document.getElementById("chat-messages");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const loader = document.getElementById("chat-loader");

  function toggleChat() {
    if (chatbox.style.display === "flex") {
      chatbox.style.display = "none";
    } else {
      chatbox.style.display = "flex";
      if (window.innerWidth <= 768) {
        chatbox.classList.add("fullscreen");
      } else {
        chatbox.classList.remove("fullscreen");
      }
    }
  }

  chatToggle.addEventListener("click", toggleChat);

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.innerHTML = marked.parse(text);
    messagesContainer.appendChild(div);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function showLoader() {
    loader.style.display = "block";
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function hideLoader() {
    loader.style.display = "none";
  }

  function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    appendMessage("user", question);
    input.value = "";
    showLoader();

    fetch("/", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-Requested-With": "XMLHttpRequest"
      },
      body: new URLSearchParams({ question })
    })
    .then(res => res.json())
    .then(data => {
      hideLoader();
      appendMessage("sallie", data.answer);
    })
    .catch(err => {
      hideLoader();
      appendMessage("sallie", "Oops! Something went wrong.");
      console.error(err);
    });
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
