version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: netily_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: ../.env
    environment:
      - POSTGRES_DB=${DB_NAME:-isp_management}
      - POSTGRES_USER=${DB_USER:-isp_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - isp_network

  redis:
    image: redis:7-alpine
    container_name: netily_redis
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      - isp_network

  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_backend
    restart: unless-stopped
    command: >
      sh -c "echo 'Running migrations...' &&
             python manage.py migrate_schemas --shared 2>&1 &&
             python manage.py migrate_schemas --tenant 2>&1 &&
             echo 'Migrations complete.' &&
             echo 'Setting up routes...' &&
             VPN_IP=$$(getent hosts netily-openvpn-isp | awk '{ print $$1 }') &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             echo 'Adding route for '$${VPN_NETWORK_CIDR:-10.8.0.0/16}' via '$$VPN_IP &&
             ip route add $${VPN_NETWORK_CIDR:-10.8.0.0/16} via $$VPN_IP || true &&
             echo 'Route added successfully!' &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 300"
    working_dir: /app
    volumes:
      - ../:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - wireguard_peers:/etc/wireguard/peers
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - DJANGO_ALLOWED_HOSTS=api.netily.co.ke,.netily.co.ke,localhost
      - TENANT_BASE_DOMAIN=netily.co.ke
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
      - OPENVPN_MANAGEMENT_HOST=netily-openvpn
      - VPN_GATEWAY_IP=${VPN_GATEWAY_IP:-10.8.0.1}
      - BASE_URL=${BASE_URL:-https://api.netily.co.ke}
      - FRONTEND_URL=${FRONTEND_URL:-https://netily.co.ke}
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - WG_PEERS_DIR=/etc/wireguard/peers
      - WG_SERVER_PORT=${WG_SERVER_PORT:-51820}
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wireguard:
         condition: service_started
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - isp_network
      - vpn_network

  celery-worker:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_worker
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "VPN_IP=$$(getent hosts netily-openvpn-isp | awk '{ print $$1 }') &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             echo 'Adding route for '$${VPN_NETWORK_CIDR:-10.8.0.0/16}' via '$$VPN_IP &&
             ip route add $${VPN_NETWORK_CIDR:-10.8.0.0/16} via $$VPN_IP || true &&
             celery -A config worker -l info --concurrency=4 -Q default,celery,radius,billing,notifications"
    volumes:
      - ../:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - wireguard_peers:/etc/wireguard/peers
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
      - OPENVPN_MANAGEMENT_HOST=netily-openvpn
      - VPN_GATEWAY_IP=${VPN_GATEWAY_IP:-10.8.0.1}
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - WG_PEERS_DIR=/etc/wireguard/peers
      - WG_SERVER_PORT=${WG_SERVER_PORT:-51820}
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - isp_network
      - vpn_network

  celery-beat:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_beat
    restart: unless-stopped
    working_dir: /app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../:/app
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 80M
    networks:
      - isp_network

  radius:
    build:
      context: ..
      dockerfile: docker/Dockerfile.radius
    container_name: netily_radius
    restart: unless-stopped
    # PERMANENT FIX: Add the route back to the VPN before starting FreeRADIUS
    command: >
      sh -c "VPN_IP=$$(getent hosts netily-openvpn-isp | awk '{ print $$1 }') &&
             echo 'Adding route for 10.8.0.0/16 via '$$VPN_IP &&
             ip route add 10.8.0.0/16 via $$VPN_IP || true &&
             freeradius -f"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    env_file: ../.env
    environment:
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_SCHEMA=public
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
    volumes:
      - ../radius_config/sites-available/default:/etc/freeradius/sites-enabled/default:ro
      - ../radius_config/mods-config/sql/main/postgresql/queries.conf:/etc/freeradius/mods-config/sql/main/postgresql/queries.conf:ro
    depends_on:
      db:
        condition: service_healthy
      wireguard:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      isp_network:
        aliases:
          - netily-radius-isp
      vpn_network:
        ipv4_address: 10.10.0.3    # Static IP for RADIUS - eliminates DNS race condition
        aliases:
          - netily-radius-vpn

  frontend:
    build:
      context: ../../netily_frontend
      dockerfile: Dockerfile
    container_name: netily_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - isp_network

  nginx:
    image: nginx:alpine
    container_name: netily_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend
    deploy:
      resources:
        limits:
          memory: 30M
    networks:
      - isp_network

  certbot:
    image: certbot/certbot
    container_name: netily_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    networks:
      - isp_network

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: netily-openvpn   # Keep alias so internal DNS works
    restart: unless-stopped
    privileged: true                  # Gives container permission to change kernel settings
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1         # The "switch" that allows traffic to flow through
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Nairobi
      - SERVERURL=${WG_SERVER_HOST:-vpn.netily.co.ke}
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - PEERS=0                       # We manage peers manually via Django
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - ALLOWEDIPS=0.0.0.0/0
      # PERMANENT FIX: Force IP, MTU 1320, and forward straight to 10.10.0.3
      - POSTUP=ip addr add 10.8.0.1/16 dev %i || true; ip link set dev %i mtu 1320; iptables -t nat -A PREROUTING -p udp -m multiport --dports 1812,1813,3799 -j DNAT --to-destination 10.10.0.3; iptables -t nat -A POSTROUTING -o %i -j MASQUERADE
    volumes:
      - wireguard_config:/config
      - wireguard_peers:/etc/wireguard/peers
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_SERVER_PORT:-51820}:51820/udp"
    deploy:
      resources:
        limits:
          memory: 50M
    networks:
      isp_network:
        aliases:
          - netily-openvpn-isp
      vpn_network:
        aliases:
          - netily-openvpn-vpn

networks:
  isp_network:
    driver: bridge
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  postgres_data:
    external: false
    labels:
      com.netily.critical: "true"
      com.netily.description: "PostgreSQL database - DO NOT DELETE"
  redis_data:
  static_volume:
  media_volume:
  wireguard_config:
  wireguard_peers:
  freeradius_data:
  freeradius_logs:
  certbot_www:
  certbot_certs: