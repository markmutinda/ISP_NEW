version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: netily_db
    volumes:
      - /var/lib/docker/volumes/6cf8ec734407cd7580a97b02c5ed5019867275b935f36c877e65ac3f9cc1b2c4/_data:/var/lib/postgresql/data
    env_file: ../.env
    environment:
      - POSTGRES_DB=isp_management
      - POSTGRES_USER=isp_user
      - POSTGRES_PASSWORD=changeme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netily -d netily_isp"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - isp_network

  redis:
    image: redis:7-alpine
    container_name: netily_redis
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      - isp_network

  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_backend
    restart: unless-stopped
    command: >
      sh -c "echo 'Running migrations...' &&
             python manage.py migrate_schemas --shared 2>&1 &&
             python manage.py migrate_schemas --tenant 2>&1 &&
             echo 'Migrations complete.' &&
             echo 'Setting up routes...' &&
             VPN_IP=$$(getent hosts netily-openvpn-isp | awk '{ print $$1 }') &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             echo 'Adding route for '$${VPN_NETWORK_CIDR:-10.8.0.0/16}' via '$$VPN_IP &&
             ip route add $${VPN_NETWORK_CIDR:-10.8.0.0/16} via $$VPN_IP || true &&
             echo 'Route added successfully!' &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    working_dir: /app
    volumes:
      - ../:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - openvpn_ccd:/etc/openvpn/ccd
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - DJANGO_ALLOWED_HOSTS=api.netily.co.ke,.netily.co.ke,localhost
      - TENANT_BASE_DOMAIN=netily.co.ke
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_NAME=netily_isp
      - DB_USER=netily
      - DB_PASS=CreativE@2028y
      - OPENVPN_MANAGEMENT_HOST=netily-openvpn
      - VPN_GATEWAY_IP=${VPN_GATEWAY_IP:-10.8.0.1}
      - BASE_URL=${BASE_URL:-https://api.netily.co.ke}
      - FRONTEND_URL=${FRONTEND_URL:-https://netily.co.ke}
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - WG_NETWORK_CIDR=${WG_NETWORK_CIDR:-10.9.0.0/16}
      - WG_SERVER_IP=${WG_SERVER_IP:-10.9.0.1}
      - WG_SERVER_PUBLIC_KEY=${WG_SERVER_PUBLIC_KEY:-}
      - WG_SERVER_ENDPOINT=${WG_SERVER_ENDPOINT:-vpn.netily.co.ke:51820}
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      openvpn:
         condition: service_started
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - isp_network
      - vpn_network

  celery-worker:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_worker
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "VPN_IP=$$(getent hosts netily-openvpn-isp | awk '{ print $$1 }') &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             echo 'Adding route for '$${VPN_NETWORK_CIDR:-10.8.0.0/16}' via '$$VPN_IP &&
             ip route add $${VPN_NETWORK_CIDR:-10.8.0.0/16} via $$VPN_IP || true &&
             celery -A config worker -l info --concurrency=4 -Q default,celery,radius,billing,notifications"
    volumes:
      - ../:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - openvpn_ccd:/etc/openvpn/ccd
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_NAME=netily_isp
      - DB_USER=netily
      - DB_PASS=CreativE@2028y
      - OPENVPN_MANAGEMENT_HOST=netily-openvpn
      - VPN_GATEWAY_IP=${VPN_GATEWAY_IP:-10.8.0.1}
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - WG_NETWORK_CIDR=${WG_NETWORK_CIDR:-10.9.0.0/16}
      - WG_SERVER_IP=${WG_SERVER_IP:-10.9.0.1}
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - isp_network
      - vpn_network

  celery-beat:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_beat
    restart: unless-stopped
    working_dir: /app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../:/app
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_NAME=netily_isp
      - DB_USER=netily
      - DB_PASS=CreativE@2028y
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 80M
    networks:
      - isp_network

  radius:
    build:
      context: ..
      dockerfile: docker/Dockerfile.radius
    container_name: netily_radius
    restart: unless-stopped
    # FIX: Removed -X flag to turn off debug mode (reduces log verbosity)
    command: freeradius -f
    # FIX: Added log rotation to prevent disk space exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    env_file: ../.env
    environment:
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_NAME=netily_isp
      - DB_USER=netily
      - DB_PASS=CreativE@2028y
      - DB_SCHEMA=public
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
      - WG_NETWORK_CIDR=${WG_NETWORK_CIDR:-10.9.0.0/16}
      - WG_SERVER_IP=${WG_SERVER_IP:-10.9.0.1}
    volumes:
      - ../radius_config/sites-available/default:/etc/freeradius/sites-enabled/default:ro
      - ../radius_config/mods-config/sql/main/postgresql/queries.conf:/etc/freeradius/mods-config/sql/main/postgresql/queries.conf:ro
    depends_on:
      db:
        condition: service_healthy
      openvpn:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      isp_network:
        aliases:
          - netily-radius-isp
      vpn_network:
        aliases:
          - netily-radius-vpn

  frontend:
    build:
      context: ../../netily_frontend
      dockerfile: Dockerfile
    container_name: netily_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - isp_network

  nginx:
    image: nginx:alpine
    container_name: netily_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend
    deploy:
      resources:
        limits:
          memory: 30M
    networks:
      - isp_network

  certbot:
    image: certbot/certbot
    container_name: netily_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    networks:
      - isp_network

  openvpn:
    image: kylemanna/openvpn:latest
    container_name: netily-openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
      - "1194:1194/tcp"
    volumes:
      - openvpn_data:/etc/openvpn
      - openvpn_ccd:/etc/openvpn/ccd
      - openvpn_logs:/var/log/openvpn
      - ../radius_config/ports:/etc/openvpn/ports:ro
    environment:
      - OPENVPN_OPTS=--management 0.0.0.0 7505
      - VPN_NETWORK_CIDR=${VPN_NETWORK_CIDR:-10.8.0.0/16}
    command: >
      sh -c "ovpn_run &
             echo 'Waiting for tun0...' &&
             while ! ip link show tun0 > /dev/null 2>&1; do sleep 1; done &&
             echo 'tun0 is up! Applying Forwarding Rules...' &&
             iptables -t nat -I POSTROUTING -o tun0 -j MASQUERADE &&
             iptables -I FORWARD -i tun0 -p udp -m multiport --dports 1812,1813 -j ACCEPT &&
             iptables -I FORWARD -o tun0 -p udp -m multiport --sports 1812,1813 -j ACCEPT &&
             echo 'Waiting for RADIUS container to be resolvable...' &&
             for i in $$(seq 1 30); do
               BASE_IP=$$(getent hosts netily-radius-isp | awk '{ print $$1 }')
               if [ -n \"$$BASE_IP\" ]; then
                 echo \"RADIUS container resolved to: $$BASE_IP (attempt $$i)\"
                 break
               fi
               echo \"Attempt $$i/30: netily-radius-isp not yet resolvable, sleeping 2s...\"
               sleep 2
             done &&
             if [ -n \"$$BASE_IP\" ]; then
               echo \"Forwarding 1812/1813 to Shared Radius ($$BASE_IP)\" &&
               iptables -t nat -C PREROUTING -i tun0 -p udp --dport 1812 -j DNAT --to-destination $$BASE_IP:1812 2>/dev/null ||
               iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1812 -j DNAT --to-destination $$BASE_IP:1812 &&
               iptables -t nat -C PREROUTING -i tun0 -p udp --dport 1813 -j DNAT --to-destination $$BASE_IP:1813 2>/dev/null ||
               iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1813 -j DNAT --to-destination $$BASE_IP:1813 &&
               echo \"RADIUS DNAT rules applied\"
             else
               echo \"ERROR: Shared RADIUS container not found after 30 attempts\"
             fi &&
             echo 'All Rules Applied.' &&
             wait"
    sysctls:
      - net.ipv4.ip_forward=1
    deploy:
      resources:
        limits:
          memory: 50M
    networks:
      isp_network:
        aliases:
          - netily-openvpn-isp
      vpn_network:
        aliases:
          - netily-openvpn-vpn

networks:
  isp_network:
    driver: bridge
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24

volumes:
  postgres_data:
    external: false
    labels:
      com.netily.critical: "true"
      com.netily.description: "PostgreSQL database - DO NOT DELETE"
  redis_data:
  static_volume:
  media_volume:
  openvpn_data:
  openvpn_ccd:
  openvpn_logs:
  freeradius_data:
  freeradius_logs:
  certbot_www:
  certbot_certs: