version: '3.8'

# ────────────────────────────────────────────────────────────────
# ALL secrets come from ../.env  (env_file on each service)
# ────────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────────
  # DATABASE
  # ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: netily_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: ../.env
    environment:
      - POSTGRES_DB=${DB_NAME:-isp_management}
      - POSTGRES_USER=${DB_USER:-isp_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    # Do NOT expose to the internet — only internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # REDIS
  # ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: netily_redis
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # DJANGO WEB APPLICATION (The Heart)
  # ────────────────────────────────────────────────────────────────
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_backend
    restart: unless-stopped
    command: >
      sh -c "echo 'Setting up routes...' &&
             VPN_IP=$$(python -c \"import socket; print(socket.gethostbyname('netily-openvpn'))\") &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             ip route add 192.168.255.0/24 via $$VPN_IP || true &&
             echo 'Route added successfully!' &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 240 --max-requests 500 --max-requests-jitter 50"
    working_dir: /app
    volumes:
      - ../:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      openvpn:
         condition: service_started
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 250M
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # CELERY WORKER
  # ────────────────────────────────────────────────────────────────
  celery-worker:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_worker
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "VPN_IP=$$(getent hosts netily-openvpn | awk '{ print $$1 }') &&
             ip route add 192.168.255.0/24 via $$VPN_IP || true &&
             celery -A config worker -l info --concurrency=2 --max-memory-per-child=150000"
    volumes:
      - ../:/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # CELERY BEAT SCHEDULER
  # ────────────────────────────────────────────────────────────────
  celery-beat:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_beat
    restart: unless-stopped
    working_dir: /app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../:/app
    env_file: ../.env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${SECRET_KEY:-changeme-generate-a-real-key}
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 80M
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # FREERADIUS SERVER (BASE TEMPLATE)
  # ────────────────────────────────────────────────────────────────
  radius:
    build:
      context: ..
      dockerfile: docker/Dockerfile.radius
    container_name: netily_radius_base
    restart: unless-stopped
    env_file: ../.env
    environment:
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_SCHEMA=public
      - RADIUS_CLIENTS=0.0.0.0/0
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 60M
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # NGINX REVERSE PROXY + SSL TERMINATION
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: netily_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 30M
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # CERTBOT (SSL via Let's Encrypt)
  # ────────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: netily_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Runs once then exits — renew via cron on host
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done;'"
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # OPENVPN SERVER (The Veins)
  # ────────────────────────────────────────────────────────────────
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: netily-openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
      - "1194:1194/tcp"
      - "7505:7505"
      - "8728:8728"
    volumes:
      - openvpn_data:/etc/openvpn
      - openvpn_ccd:/etc/openvpn/ccd
      - openvpn_logs:/var/log/openvpn
    environment:
      - OPENVPN_OPTS=--management localhost 7505
    command: >
      sh -c "ovpn_run &
             echo 'Waiting for tun0...' &&
             while ! ip link show tun0 > /dev/null 2>&1; do sleep 1; done &&
             echo 'tun0 is up! Applying Forwarding Rules...' &&
             
             iptables -t nat -I POSTROUTING -o tun0 -j MASQUERADE &&
             
             BASE_IP=\$$(getent hosts netily_radius_base | awk '{ print \$$1 }') &&
             if [ ! -z \"\$$BASE_IP\" ]; then
               echo \"Forwarding 1812/1813 to Base Radius (\$$BASE_IP)\" &&
               iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1812 -j DNAT --to-destination \$$BASE_IP:1812 &&
               iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1813 -j DNAT --to-destination \$$BASE_IP:1813 &&
               iptables -t nat -A POSTROUTING -d \$$BASE_IP -p udp -j MASQUERADE;
             else
               echo \"Warning: Base RADIUS container not found\";
             fi &&
             
             echo 'All Rules Applied.' &&
             wait"
    sysctls:
      - net.ipv4.ip_forward=1
    deploy:
      resources:
        limits:
          memory: 50M
    networks:
      - vpn_network
      - isp_network

# ────────────────────────────────────────────────────────────────
# NETWORKS
# ────────────────────────────────────────────────────────────────
networks:
  isp_network:
    driver: bridge
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.0.0/24

# ────────────────────────────────────────────────────────────────
# VOLUMES
# ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  openvpn_data:
  openvpn_ccd:
  openvpn_logs:
  freeradius_data:
  freeradius_logs:
  certbot_www:
  certbot_certs: