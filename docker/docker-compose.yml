version: '3.8'

services:
  # ────────────────────────────────────────────────────────────────
  # DATABASE
  # ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: netily_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=isp_management
      - POSTGRES_USER=isp_user
      - POSTGRES_PASSWORD=2202
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # REDIS
  # ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: netily_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # DJANGO WEB APPLICATION (The Heart)
  # ────────────────────────────────────────────────────────────────
  web:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_backend
# AUTOMATION: 1. Use Python to find IP (Robust), 2. Add Route
    command: >
      sh -c "echo 'Setting up routes...' &&
             VPN_IP=$$(python -c \"import socket; print(socket.gethostbyname('netily-openvpn'))\") &&
             echo 'VPN Gateway found at: '$$VPN_IP &&
             ip route add 192.168.255.0/24 via $$VPN_IP || true &&
             echo 'Route added successfully!' &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --reload"
    working_dir: /app
    volumes:
      - ../:/app
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=super-secret-key-for-docker-testing-12345
      - DJANGO_ALLOWED_HOSTS=localhost,.localhost,127.0.0.1,web,netily_backend,192.168.255.1,192.168.100.149
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_NAME=isp_management
      - DB_USER=isp_user
      - DB_PASSWORD=2202
      - DB_PORT=5432
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      openvpn:
         condition: service_started
    ports:
      - "8000:8000"
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # CELERY WORKER
  # ────────────────────────────────────────────────────────────────
  celery-worker:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_worker
    working_dir: /app
    # AUTOMATION: Worker also needs the route to talk to routers
    command: >
      sh -c "VPN_IP=\$(getent hosts netily-openvpn | awk '{ print \$1 }') &&
             ip route add 192.168.255.0/24 via \$VPN_IP || true &&
             celery -A config worker -l info --concurrency=4"
    volumes:
      - ../:/app
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=super-secret-key-for-docker-testing-12345
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_NAME=isp_management
      - DB_USER=isp_user
      - DB_PASSWORD=2202
      - DB_PORT=5432
    cap_add:
      - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # CELERY BEAT SCHEDULER
  # ────────────────────────────────────────────────────────────────
  celery-beat:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: netily_beat
    working_dir: /app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../:/app
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=super-secret-key-for-docker-testing-12345
      - REDIS_URL=redis://netily_redis:6379/0
      - DB_HOST=netily_db
      - DB_NAME=isp_management
      - DB_USER=isp_user
      - DB_PASSWORD=2202
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - isp_network

  # ────────────────────────────────────────────────────────────────
  # FREERADIUS SERVER
  # ────────────────────────────────────────────────────────────────
  radius:
    build:
      context: ..
      dockerfile: docker/Dockerfile.radius
    container_name: netily_radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
      - "18120:18120/tcp"
    environment:
      - DB_HOST=netily_db
      - DB_PORT=5432
      - DB_NAME=isp_management
      - DB_USER=isp_user
      - DB_PASS=2202
      - DB_PASSWORD=2202
      - DB_SCHEMA=public
      - RADIUS_CLIENTS=0.0.0.0/0
      - RADIUS_SECRET=testing123
      - RADIUS_DOCKER_SECRET=testing123
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - isp_network
      - vpn_network

  # ────────────────────────────────────────────────────────────────
  # NGINX REVERSE PROXY
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: netily_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - isp_network

# ────────────────────────────────────────────────────────────────
  # OPENVPN SERVER (The Veins)
  # ────────────────────────────────────────────────────────────────
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: netily-openvpn
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
      - "1194:1194/tcp"
      - "7505:7505"
      - "8728:8728"
    volumes:
      - openvpn_data:/etc/openvpn
      - openvpn_ccd:/etc/openvpn/ccd
      - openvpn_logs:/var/log/openvpn
    environment:
      - OPENVPN_OPTS=--management localhost 7505
    # -----------------------------------------------------------
    # UPDATED COMMAND: Forward RADIUS traffic to the Radius Container
    # -----------------------------------------------------------
    command: >
      sh -c "ovpn_run &
             echo 'Waiting for tun0...' &&
             while ! ip link show tun0 > /dev/null 2>&1; do sleep 1; done &&
             echo 'tun0 is up! Applying Forwarding Rules...' &&
             # 1. Allow Outbound (Standard)
             iptables -t nat -I POSTROUTING -o tun0 -j MASQUERADE &&
             # 2. Find Radius IP
             RADIUS_IP=\$$(getent hosts netily_radius | awk '{ print \$$1 }') &&
             echo \"Forwarding RADIUS ports to \$$RADIUS_IP...\" &&
             # 3. Forward Incoming 1812/1813 from Tunnel -> Radius Container
             iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1812 -j DNAT --to-destination \$$RADIUS_IP:1812 &&
             iptables -t nat -A PREROUTING -i tun0 -p udp --dport 1813 -j DNAT --to-destination \$$RADIUS_IP:1813 &&
             # 4. Masquerade the forwarded traffic so Radius knows where to reply
             iptables -t nat -A POSTROUTING -d \$$RADIUS_IP -p udp --dport 1812 -j MASQUERADE &&
             iptables -t nat -A POSTROUTING -d \$$RADIUS_IP -p udp --dport 1813 -j MASQUERADE &&
             echo 'Rules Applied.' &&
             wait"
    restart: unless-stopped
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - vpn_network
      - isp_network

# ────────────────────────────────────────────────────────────────
# NETWORKS
# ────────────────────────────────────────────────────────────────
networks:
  isp_network:
    driver: bridge
  vpn_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.0.0/24

# ────────────────────────────────────────────────────────────────
# VOLUMES
# ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  openvpn_data:
  openvpn_ccd:
  openvpn_logs:
  freeradius_data:
  freeradius_logs: