# ================================================================
# NETILY CLOUD CONTROLLER — Nginx Reverse Proxy
# ================================================================
# Routes:
#   api.netily.co.ke          → Django backend (gunicorn)
#   www.netily.co.ke           → Next.js frontend
#   *.netily.co.ke (tenants)   → /api/ to backend, else frontend
#   bentrextechnologies.com    → Custom tenant domain → frontend
#   www.bentrextechnologies.com → Custom tenant domain with www
# CORS is handled entirely by Django (django-cors-headers).
# ================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    # ── CHANGE 1: Add Docker's internal DNS resolver ───────────
    # This forces Nginx to re-check IP addresses every 10 seconds.
    resolver 127.0.0.11 valid=10s;
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # ── FIX 3: Upstream keepalive pool for Django ──────────────
    # This reuses TCP connections to gunicorn, eliminating the TCP
    # handshake per request. Dramatically reduces latency under load.
    upstream netily_backend_pool {
        server netily_backend:8000;
        keepalive 32;
    }

    # ── Frontend upstream pool (optional but clean) ────────────
    upstream netily_frontend_pool {
        server netily_frontend:3000;
        keepalive 16;
    }

    # Gzip (enabled globally but disabled for provisioning endpoints)
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Captive Portal Nginx Micro-Cache ──────────────────────
    # Short-lived cache at the edge to reduce Django load on high-traffic
    # captive portal endpoints. The actual invalidation is handled by
    # Django's cache versioning (bump_cache_version).
    proxy_cache_path /tmp/nginx_captive_cache levels=1:2 keys_zone=captive_cache:10m max_size=200m inactive=10m use_temp_path=off;

    # ── TCP MSS Clamping (belt-and-suspenders for MikroTik MTU issues) ──
    # Reduces TCP segment size to prevent fragmentation at TLS layer
    # This helps MikroTik /tool fetch handle HTTPS without silent drops
    tcp_nodelay on;
    
    # Global TCP MSS clamping for all proxy connections
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Note: Static 'upstream' blocks were removed here because 
    # they cause Nginx to permanently cache IPs.

    # ── HTTP → HTTPS redirect (all domains) ────────────────────
    # This single server block handles ALL HTTP traffic
    server {
        listen 80;
        server_name api.netily.co.ke *.netily.co.ke netily.co.ke bentrextechnologies.com www.bentrextechnologies.com;

        # Certbot ACME challenge (must stay on port 80)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: API-only backend (api.netily.co.ke) ─────────────
    # FIX 1: HTTP/2 disabled for MikroTik compatibility
    server {
        listen 443 ssl;
        # http2 on;  ← REMOVED - MikroTik /tool fetch doesn't support HTTP/2
        server_name api.netily.co.ke;

        # Wildcard cert covers api.netily.co.ke
        ssl_certificate     /etc/letsencrypt/live/netily.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netily.co.ke/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Additional SSL settings to help with MikroTik compatibility
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_buffer_size 4k;  # Reduce buffer size for better MTU handling

        # ─── FIX: Block exploit/secret-scanning probes ────────────
        location ~* /(\.env|\.git|\.aws|\.docker|wp-admin|wp-login\.php|xmlrpc\.php|config\.php|\.ssh|vendor/) {
            deny all;
            return 404;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        location /health/ {
            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # ── FIX 3: Disable gzip for MikroTik provisioning ──────────
        # MikroTik /tool fetch cannot decode gzip - causes "timeout waiting data"
        location ~ ^/api/v1/network/provision/ {
            # CRITICAL: Disable gzip for MikroTik compatibility
            gzip off;
            proxy_hide_header Content-Encoding;
            proxy_set_header Accept-Encoding "";
            
            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Smaller buffer to start streaming immediately
            proxy_buffering off;
            proxy_read_timeout 120s;
            
            # Pass standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header ngrok-skip-browser-warning "true";
        }

        # ── FIX 4: Also cover legacy config endpoint ───────────────
        location = /api/v1/network/routers/config/ {
            gzip off;
            proxy_hide_header Content-Encoding;
            proxy_set_header Accept-Encoding "";
            
            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── Captive Portal — Nginx micro-cache at the edge ──────
        # 🔥 OPTIMIZATION: Extended cache TTL to 300s (5 minutes)
        # Django's cache_versioning already invalidates instantly on
        # plan/branding writes (bump_cache_version), so the edge cache
        # can safely live much longer without ever serving stale data
        # after an admin edit.
        location = /api/v1/hotspot/captive-portal/ {
            proxy_cache captive_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 300s;             # 5 minutes at edge (was 30s)
            proxy_cache_background_update on;       # refresh in background while serving stale
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_lock on;                    # collapse concurrent identical misses at the edge
            proxy_cache_lock_timeout 2s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            proxy_connect_timeout 30;
        }
    }

    # ── HTTPS: Frontend + tenant API (*.netily.co.ke) ──────────
    # This server block keeps HTTP/2 enabled for frontend performance
    server {
        listen 443 ssl;
        http2 on;  # HTTP/2 is fine for frontend browsers
        server_name netily.co.ke www.netily.co.ke *.netily.co.ke bentrextechnologies.com www.bentrextechnologies.com;

        # Wildcard cert (obtain via DNS-01 challenge — see deploy notes)
        ssl_certificate     /etc/letsencrypt/live/netily.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netily.co.ke/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Additional SSL settings to help with MikroTik compatibility
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_buffer_size 4k;

        # ─── FIX: Block exploit/secret-scanning probes ────────────
        location ~* /(\.env|\.git|\.aws|\.docker|wp-admin|wp-login\.php|xmlrpc\.php|config\.php|\.ssh|vendor/) {
            deny all;
            return 404;
        }

        # ─────────────────────────────────────────────────────────────
        # Anti-Injector / Tunnel hardening (tenant domains)
        # ─────────────────────────────────────────────────────────────

        # 1. Completely reject the CONNECT method
        if ($request_method = CONNECT) {
            return 403;
        }

        # 2. Reject most WebSocket upgrades (injectors need 101 Switching Protocols)
        set $block_ws 0;
        if ($http_upgrade ~* "websocket") {
            set $block_ws 1;
        }
        if ($uri ~* "^/(api|static|media|_next|hotspot)") {
            set $block_ws 0;
        }
        if ($block_ws = 1) {
            return 403;
        }

        # 3. Block empty / suspicious User-Agents common in injectors
        #    SKIP this check for API/webhook traffic — server-to-server callbacks
        #    (Safaricom Daraja, Tuma, etc.) legitimately send empty or non-browser UAs.
        set $ua_check_target 1;
        if ($uri ~* "^/api/") {
            set $ua_check_target 0;
        }
        if ($http_user_agent = "") {
            set $ua_check_target "${ua_check_target}1";
        }
        if ($http_user_agent ~* "(python|curl|okhttp|Go-http|Injector|SSH|OpenSSH)") {
            set $ua_check_target "${ua_check_target}1";
        }
        if ($ua_check_target = "011") {
            return 403;
        }

        # ── Backend: API routes ────────────────────────────────
        # Public browser proxy routes must reach Next.js first. These handlers
        # read secure first-party attribution cookies and forward a normalized
        # request to Django. Without this more-specific location, the generic
        # /api/ block sends /api/public/* to a non-existent Django path.
        location ^~ /api/public/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://netily_frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 30;
            proxy_send_timeout 30;
            proxy_connect_timeout 10;
        }

        # ── Captive Portal — Nginx micro-cache at the edge ──────
        # 🔥 OPTIMIZATION: Extended cache TTL to 300s (5 minutes)
        # Django's cache_versioning already invalidates instantly on
        # plan/branding writes (bump_cache_version), so the edge cache
        # can safely live much longer without ever serving stale data
        # after an admin edit.
        location = /api/v1/hotspot/captive-portal/ {
            proxy_cache captive_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 300s;             # 5 minutes at edge (was 30s)
            proxy_cache_background_update on;       # refresh in background while serving stale
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            proxy_cache_lock on;                    # collapse concurrent identical misses at the edge
            proxy_cache_lock_timeout 2s;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            proxy_connect_timeout 30;
        }

        # Django admin panel (if you need it via tenant domain)
        location /django-admin/ {
            proxy_pass http://netily_backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }

        # Static files served from Django
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # ── Frontend: everything else → Next.js ────────────────
        location / {
            proxy_pass http://netily_frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }
}