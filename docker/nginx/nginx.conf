# ================================================================
# NETILY CLOUD CONTROLLER — Nginx Reverse Proxy
# ================================================================
# Sits in front of Gunicorn, serves static/media, terminates SSL
# CORS is handled entirely by Django (django-cors-headers) — do
# NOT add Access-Control-* headers here to avoid duplicates.
# ================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream: Gunicorn ─────────────────────────────────────
    upstream django {
        server netily_backend:8000;
    }

    # ── HTTP server ────────────────────────────────────────────
    # Serves ACME challenges for certbot and proxies to Django.
    # After obtaining SSL certs, uncomment "return 301" to force HTTPS.
    server {
        listen 80;
        server_name api.netily.co.ke;

        # Certbot ACME challenge (must stay on port 80)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── AFTER running certbot, uncomment this to redirect HTTP→HTTPS ──
        # return 301 https://$host$request_uri;

        # ── Static files ───────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # ── Health check (no rate limit) ───────────────────────
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        # ── API & Admin ────────────────────────────────────────
        location / {
            limit_req zone=api burst=60 nodelay;

            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }
    }

    # ── HTTPS server (uncomment ENTIRE block after running certbot) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name api.netily.co.ke;
    #
    #     ssl_certificate     /etc/letsencrypt/live/api.netily.co.ke/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.netily.co.ke/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
