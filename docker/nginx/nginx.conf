# ============================================================================ #
# NETILY PRODUCTION NGINX CONFIGURATION
# ============================================================================ #
# Architecture:
#   - Backend:      netily_backend:8000  (Django/Gunicorn)
#   - Frontend:     netily_frontend:3000 (Next.js)
#   - SSL:          Cloudflare Full (strict) mode
# ============================================================================ #

# ──────────────────────────────────────────────────────────────────────────────
# GLOBAL SETTINGS
# ──────────────────────────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Base settings ─────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host="$host"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    server_tokens off;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml
               image/svg+xml application/x-font-ttf;

    # ── Cloudflare Real IP ──────────────────────────────────────────────────
    # This ensures Nginx logs the visitor's real IP, not Cloudflare's edge IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header CF-Connecting-IP;

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream backend {
        server netily_backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend {
        server netily_frontend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTP → HTTPS REDIRECT (ALL DOMAINS)
    # ──────────────────────────────────────────────────────────────────────────
    # This single server block handles ALL HTTP traffic for all domains.
    # It redirects to HTTPS so Cloudflare's Full (strict) mode works properly.
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name api.netily.co.ke *.netily.co.ke netily.co.ke bentrextechnologies.com www.bentrextechnologies.com;

        # Redirect everything to HTTPS
        return 301 https://$host$request_uri;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTPS: BACKEND / API (api.netily.co.ke)
    # ──────────────────────────────────────────────────────────────────────────
    # This server block handles:
    #   - api.netily.co.ke   → Django REST API + admin
    #   - *.api.netily.co.ke → Tenant-specific API endpoints
    #   - Admin panel access
    #
    # HTTP/2 is disabled here because Cloudflare handles the HTTP/2 termination
    # at the edge. This backend server uses HTTP/1.1 with keepalive, which is
    # simpler, more stable, and reduces overhead for API workloads.
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 off;  # Cloudflare handles HTTP/2 at the edge — no need for double overhead
        server_name api.netily.co.ke *.api.netily.co.ke;

        # SSL certificates (provided by Cloudflare's origin pull)
        ssl_certificate /etc/letsencrypt/live/api.netily.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.netily.co.ke/privkey.pem;

        # Modern TLS configuration (A+ rating)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Location: API routes ─────────────────────────────────────────────
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTPS: FRONTEND + TENANT SUBDOMAINS + CUSTOM DOMAINS
    # ──────────────────────────────────────────────────────────────────────────
    # This server block handles:
    #   - netily.co.ke                 → Main marketing site
    #   - *.netily.co.ke               → Tenant subdomains (e.g., bentrex.netily.co.ke)
    #   - bentrextechnologies.com      → Custom tenant domain
    #   - www.bentrextechnologies.com  → Custom tenant domain with www
    #
    # For tenant subdomains and custom domains:
    #   - /api/* → Proxied to Django backend for API calls
    #   - /*      → Proxied to Next.js frontend for the user portal
    #
    # HTTP/2 is enabled here for frontend performance benefits
    # because browsers connect directly to this server for tenant domains.
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;  # HTTP/2 is fine for frontend browsers
        server_name netily.co.ke www.netily.co.ke *.netily.co.ke bentrextechnologies.com www.bentrextechnologies.com;

        # SSL certificates (provided by Cloudflare's origin pull)
        ssl_certificate /etc/letsencrypt/live/netily.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netily.co.ke/privkey.pem;

        # Modern TLS configuration (A+ rating)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Location: API routes (proxied to Django) ─────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ── Location: Admin (proxied to Django) ──────────────────────────────
        location /admin/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_redirect off;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ── Location: Static files (served directly) ─────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Location: Frontend (everything else → Next.js) ──────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_redirect off;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # FALLBACK: Default server block (catch-all for unmatched domains)
    # ──────────────────────────────────────────────────────────────────────────
    # This prevents Nginx from serving the first configured server block
    # when an unknown domain hits the server. Returns a 444 (Connection Closed)
    # to avoid exposing the wrong site.
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl default_server;
        listen 80 default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/netily.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/netily.co.ke/privkey.pem;

        return 444;
    }
}