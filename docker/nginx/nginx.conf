# ================================================================
# NETILY CLOUD CONTROLLER — Nginx Reverse Proxy
# ================================================================
# Sits in front of Gunicorn, serves static/media, terminates SSL
# ================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream: Gunicorn ─────────────────────────────────────
    upstream django {
        server netily_backend:8000;
    }

    # ── HTTP → redirect to HTTPS (once you have certs) ────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Until SSL is set up, proxy everything on port 80
        # After running certbot, uncomment the return 301 and
        # comment out the remaining location blocks in THIS server block
        # return 301 https://$host$request_uri;

        # ── Static files ───────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # ── Health check (no rate limit) ───────────────────────
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        # ── API & Admin ────────────────────────────────────────
        location / {
            limit_req zone=api burst=60 nodelay;

            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;

            # CORS headers for Vercel frontend
            add_header Access-Control-Allow-Origin  "https://netily.vercel.app" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant" always;
            add_header Access-Control-Allow-Credentials "true" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ── HTTPS server (uncomment after running certbot) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name YOUR_DOMAIN.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
