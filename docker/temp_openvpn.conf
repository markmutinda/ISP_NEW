server 192.168.255.0 255.255.255.0
verb 3
key /etc/openvpn/pki/private/192.168.100.149.key
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/issued/192.168.100.149.crt
dh /etc/openvpn/pki/dh.pem
#tls-auth /etc/openvpn/pki/ta.key
key-direction 0
keepalive 10 60
persist-key
persist-tun

# --- PROTOCOL ---
proto tcp

# --- NETWORK TOPOLOGY ---
dev tun0
topology subnet
push "topology subnet"
push "route-gateway 192.168.255.1"
push "route 192.168.255.1 255.255.255.255"

# --- PORT & LOGS ---
port 1194
status /tmp/openvpn-status.log
user nobody
group nogroup

# --- COMPRESSION (COMPLETELY REMOVED FOR MIKROTIK v7 COMPATIBILITY) ---
# Do not add any comp-lzo or compress lines here.

# --- SECURITY & CIPHER ---
cipher AES-256-CBC
push "cipher AES-256-CBC"

### Route Configurations Below
route 192.168.254.0 255.255.255.0

### Push Configurations Below
push "block-outside-dns"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"

# --- AUTHENTICATION ---
auth-user-pass-verify /etc/openvpn/check_auth.sh via-env
script-security 3
verify-client-cert none
username-as-common-name