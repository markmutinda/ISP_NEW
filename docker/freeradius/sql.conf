# ────────────────────────────────────────────────────────────────
# FreeRADIUS SQL Configuration
# Flat query variables only: queries.conf defines accounting_start_query,
# accounting_update_query, accounting_stop_query, and postauth_query.
# ────────────────────────────────────────────────────────────────

sql {
    driver = "rlm_sql_postgresql"
    dialect = "postgresql"

    # Database connection settings (substituted by envsubst in entrypoint)
    server = "${DB_HOST}"
    port = ${DB_PORT}
    login = "${DB_USER}"
    password = "${DB_PASSWORD}"
    radius_db = "${DB_NAME}"

    # Keep NAS / client lookups on the shared schema. Per-tenant writes are
    # handled explicitly in queries.conf via %{control:Tmp-String-0}.<table>.
    connect_query = "SET search_path TO public"

    # ─── Pool sizing (matches RADIUS_MAX_SERVERS from radius-entrypoint.sh) ───
    # CHANGED (step 3): max raised 15 -> 16 so the SQL pool is at least as
    # large as the FreeRADIUS thread pool's max_servers (default 16 in the
    # entrypoint). If SQL max < thread max, worker threads block waiting for
    # a DB connection under load, which defeats the point of the tuning.
    # If you raise RADIUS_MAX_SERVERS in docker-compose.yml, raise this too.
    pool {
        start = 5
        min = 3
        max = 16
        spare = 3
        uses = 0
        lifetime = 0
        idle_timeout = 60
    }

    read_clients = yes
    # CHANGED (Claude follow-up): read_groups was yes, but no
    # group_membership_query is defined, so group lookups never worked and
    # only produced one "Cannot do check groups" warning per auth. Set to
    # no to silence the log spam. Re-enable + define a real query only if
    # you later move bandwidth profiles into radusergroup / radgroupreply.
    read_groups = no
    delete_stale_sessions = yes

    sql_user_name = "%{User-Name}"

    authcheck_table = "radcheck"
    authreply_table = "radreply"
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"

    client_query = "SELECT id, nas_ip AS nasname, nas_ip AS shortname, 'other' AS type, nas_secret AS secret FROM core_globalroutermap WHERE is_active = true"

    # ────────────────────────────────────────────────────────────────
    # CHANGED (Claude follow-up): $INCLUDE moved ABOVE the bridge blocks.
    # FreeRADIUS expands ${...} references at PARSE TIME, top to bottom.
    # Previously queries.conf was included at the END of this sql {} block,
    # so when the parser reached the accounting/post-auth bridge blocks
    # below, the flat *_query variables it defines did not exist yet.
    # Result: references resolved to empty strings, accounting and post-
    # auth writes silently failed. Moving the include up fixes the order.
    # ────────────────────────────────────────────────────────────────
    $INCLUDE /etc/freeradius/mods-config/sql/main/postgresql/queries.conf

    # FreeRADIUS 3.x resolves accounting/post-auth through nested `query`
    # references. These bridge blocks map the flat *_query variables from
    # queries.conf onto the dynamic dispatcher targets used at runtime.
    accounting {
        reference = "%{tolower:type.%{Acct-Status-Type}.query}"

        type {
            accounting-on {
                query = "${....accounting_on_query}"
            }

            accounting-off {
                query = "${....accounting_off_query}"
            }

            start {
                query = "${....accounting_start_query}"
            }

            interim-update {
                query = "${....accounting_update_query}"
            }

            stop {
                query = "${....accounting_stop_query}"
            }
        }
    }

    post-auth {
        query = "${..postauth_query}"
    }
}