# ═══════════════════════════════════════════════════════════════════════════════
# FreeRADIUS SQL Module Configuration - Netily ISP
# ═══════════════════════════════════════════════════════════════════════════════
# 
# This configuration connects FreeRADIUS to PostgreSQL for:
#   - User authentication (radcheck, radreply) - handled by queries.conf
#   - Group-based policies (radusergroup, radgroupcheck, radgroupreply) - handled by queries.conf
#   - Session accounting (radacct) - handled by queries.conf
#   - NAS/Client management (core_globalroutermap)
#   - Post-authentication logging (radpostauth) - handled by queries.conf
#
# Environment Variables (substituted at container startup):
#   ${DB_HOST}     - PostgreSQL hostname
#   ${DB_PORT}     - PostgreSQL port
#   ${DB_USER}     - Database username
#   ${DB_PASSWORD} - Database password
#   ${DB_NAME}     - Database name
#   ${DB_SCHEMA}   - Database schema (for multi-tenancy)
#
# Reference: https://wiki.freeradius.org/guide/SQL-HOWTO
# ═══════════════════════════════════════════════════════════════════════════════

sql {
    # ───────────────────────────────────────────────────────────────────────────
    # Driver Configuration
    # ───────────────────────────────────────────────────────────────────────────
    driver = "rlm_sql_postgresql"
    dialect = "postgresql"

    # ───────────────────────────────────────────────────────────────────────────
    # Database Connection
    # Environment variables are substituted by envsubst at container startup
    # ───────────────────────────────────────────────────────────────────────────
    server = "${DB_HOST}"
    port = ${DB_PORT}
    login = "${DB_USER}"
    password = "${DB_PASSWORD}"
    radius_db = "${DB_NAME}"
    
    # --- Stay in public schema for NAS lookup, then switch per user ---
    # Set search_path to public so we can read the global router map table
    # The schema for user authentication will be dynamically determined later
    connect_query = "SET search_path TO public"

    # ───────────────────────────────────────────────────────────────────────────
    # Connection Pool Configuration
    # ───────────────────────────────────────────────────────────────────────────
    pool {
        start = 5
        min = 3
        max = 32
        spare = 3
        uses = 0
        lifetime = 0
        idle_timeout = 60
    }

    # ───────────────────────────────────────────────────────────────────────────
    # Table Names (schema determined by DB_SCHEMA environment variable)
    # ───────────────────────────────────────────────────────────────────────────
    authcheck_table = "radcheck"
    authreply_table = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table = "radusergroup"
    acct_table1 = "radacct"
    acct_table2 = "radacct"
    postauth_table = "radpostauth"
    
    # --- Read clients from our global router map table ---
    # This table lives in the public schema and maps NAS IPs to tenant schemas
    client_table = "core_globalroutermap"

    # ───────────────────────────────────────────────────────────────────────────
    # Feature Flags
    # ───────────────────────────────────────────────────────────────────────────
    # Read NAS clients from database (requires nas table with entries)
    read_clients = yes
    
    # Read group configurations
    read_groups = yes
    
    # Delete stale sessions on startup
    delete_stale_sessions = yes

    # ───────────────────────────────────────────────────────────────────────────
    # SQL User Name - Used in query expansion
    # ───────────────────────────────────────────────────────────────────────────
    sql_user_name = "%{User-Name}"

    # ───────────────────────────────────────────────────────────────────────────
    # CLIENT QUERY - Load NAS/Clients from Database
    # ═══════════════════════════════════════════════════════════════════════════
    # This query loads RADIUS clients from the global router map table.
    # Each row defines a NAS that can send RADIUS requests.
    # ───────────────────────────────────────────────────────────────────────────
    client_query = "SELECT id, nas_ip AS nasname, nas_ip AS shortname, 'other' AS type, nas_secret AS secret FROM core_globalroutermap WHERE is_active = true"

    # ═══════════════════════════════════════════════════════════════════════════
    # Include dynamic queries from external file
    # This file contains all authorization, group, accounting, and post-auth 
    # queries that use %{control:Tmp-String-0} for dynamic schema routing.
    # ═══════════════════════════════════════════════════════════════════════════
    $INCLUDE /etc/freeradius/mods-config/sql/main/postgresql/queries.conf
}