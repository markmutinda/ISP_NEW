# docker/freeradius/radiusd.conf additions
# Add these listen blocks so FreeRADIUS accepts RADIUS packets
# from BOTH VPN ranges

listen {
    type = auth
    ipaddr = 10.8.0.1
    port = 1812
}

listen {
    type = acct
    ipaddr = 10.8.0.1
    port = 1813
}

listen {
    type = auth
    ipaddr = 10.9.0.1
    port = 1812
}

listen {
    type = acct
    ipaddr = 10.9.0.1
    port = 1813
}