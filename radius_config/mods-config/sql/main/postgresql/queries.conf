# -*- text -*-
## FreeRADIUS PostgreSQL Queries for Django Integration
## Multi-tenant routing via %{control:Tmp-String-0}

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /+"

#######################################################################
# Authorization Queries - Dynamic Schema
#######################################################################

authorize_check_query = "SELECT id, username, attribute, value, op FROM %{control:Tmp-String-0}.radcheck WHERE username = '%{SQL-User-Name}' ORDER BY id"

authorize_reply_query = "SELECT id, username, attribute, value, op FROM %{control:Tmp-String-0}.radreply WHERE username = '%{SQL-User-Name}' ORDER BY id"

#######################################################################
# Simultaneous Use Checking Queries
#######################################################################

simul_count_query = "SELECT COUNT(*) FROM %{control:Tmp-String-0}.radacct WHERE username = '%{SQL-User-Name}' AND acctstoptime IS NULL"

simul_verify_query = "SELECT radacctid, acctsessionid, username, nasipaddress, nasportid, framedipaddress, callingstationid, framedprotocol FROM %{control:Tmp-String-0}.radacct WHERE username = '%{SQL-User-Name}' AND acctstoptime IS NULL"

#######################################################################
# Accounting Queries - Flat syntax for sql.conf dispatcher compatibility
#######################################################################

accounting_start_query = "INSERT INTO %{control:Tmp-String-0}.radacct (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, framedipaddress, framedipv6address, framedipv6prefix, framedinterfaceid, delegatedipv6prefix, class) VALUES ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', '%{Realm}', '%{NAS-IP-Address}', '%{%{NAS-Port-ID}:-%{NAS-Port}}', '%{NAS-Port-Type}', NOW(), NOW(), NULL, 0, '%{Acct-Authentic}', '%{Connect-Info}', '', 0, 0, '%{Called-Station-Id}', '%{Calling-Station-Id}', '', '%{Service-Type}', '%{Framed-Protocol}', '%{Framed-IP-Address}', '%{Framed-IPv6-Address}', '%{Framed-IPv6-Prefix}', '%{Framed-Interface-Id}', '%{Delegated-IPv6-Prefix}', '%{Class}')"

accounting_update_query = "UPDATE %{control:Tmp-String-0}.radacct SET acctupdatetime = NOW(), acctinterval = COALESCE(NULLIF('%{Acct-Interim-Interval}', ''), acctinterval), acctsessiontime = '%{Acct-Session-Time}', acctinputoctets = '%{Acct-Input-Octets}', acctoutputoctets = '%{Acct-Output-Octets}', acctinputpackets = '%{Acct-Input-Packets}', acctoutputpackets = '%{Acct-Output-Packets}', acctinputgigawords = '%{Acct-Input-Gigawords}', acctoutputgigawords = '%{Acct-Output-Gigawords}', framedipaddress = '%{Framed-IP-Address}', framedipv6address = '%{Framed-IPv6-Address}', framedipv6prefix = '%{Framed-IPv6-Prefix}', framedinterfaceid = '%{Framed-Interface-Id}', delegatedipv6prefix = '%{Delegated-IPv6-Prefix}', class = '%{Class}' WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

accounting_stop_query = "UPDATE %{control:Tmp-String-0}.radacct SET acctstoptime = NOW(), acctupdatetime = NOW(), acctsessiontime = '%{Acct-Session-Time}', acctinputoctets = '%{Acct-Input-Octets}', acctoutputoctets = '%{Acct-Output-Octets}', acctinputpackets = '%{Acct-Input-Packets}', acctoutputpackets = '%{Acct-Output-Packets}', acctinputgigawords = '%{Acct-Input-Gigawords}', acctoutputgigawords = '%{Acct-Output-Gigawords}', acctterminatecause = '%{Acct-Terminate-Cause}', connectinfo_stop = '%{Connect-Info}', framedipaddress = '%{Framed-IP-Address}', framedipv6address = '%{Framed-IPv6-Address}', framedipv6prefix = '%{Framed-IPv6-Prefix}', framedinterfaceid = '%{Framed-Interface-Id}', delegatedipv6prefix = '%{Delegated-IPv6-Prefix}', class = '%{Class}' WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

#######################################################################
# Post-Auth Logging - Flat syntax
#######################################################################

postauth_query = "INSERT INTO %{control:Tmp-String-0}.radpostauth (username, password, reply, authdate, nasipaddress, callingstationid) VALUES ('%{SQL-User-Name}', '%{%{User-Password}:-%{Chap-Password}}', '%{reply:Packet-Type}', NOW(), '%{NAS-IP-Address}', '%{Calling-Station-Id}')"