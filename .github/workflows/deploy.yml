name: Deploy Backend to DigitalOcean VPS

on:
  push:
    branches:
      - prod-backend

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            echo "==> Pulling latest backend code..."
            cd ~/netily_cloud
            git fetch origin prod-backend
            git reset --hard origin/prod-backend

            echo "==> Rebuilding Django services..."
            cd docker
            docker compose build web celery-worker celery-beat

            echo "==> Restarting Django services..."
            docker compose up -d web celery-worker celery-beat

            echo "==> Restarting nginx (re-resolve container IPs)..."
            docker compose restart nginx

            echo "==> Waiting for web container to be ready..."
            sleep 5

            echo "==> Running database migrations (non-fatal)..."
            docker compose exec web python manage.py migrate_schemas --shared || echo "WARN: shared migration failed (may already be applied)"
            docker compose exec web python manage.py migrate_schemas || echo "WARN: tenant migration failed (may already be applied)"

            echo "==> Ensuring superadmin account exists (non-fatal)..."
            docker compose exec web python manage.py ensure_superadmin || echo "WARN: ensure_superadmin skipped (set SUPERADMIN_EMAIL/PASSWORD env vars)"

            echo "==> Collecting static files..."
            docker compose exec web python manage.py collectstatic --noinput || true

            echo "==> Verifying web container is healthy..."
            for i in 1 2 3 4 5; do
              STATUS=$(docker compose ps web --format '{{.Status}}' 2>/dev/null)
              echo "  Attempt $i: web status = $STATUS"
              if echo "$STATUS" | grep -q "Up"; then
                echo "  ✅ Web container is running!"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "  ❌ Web container failed to start. Dumping logs:"
                docker compose logs --tail=50 web
                exit 1
              fi
              sleep 3
            done

            echo "==> Health check: testing Django responds..."
            docker compose exec web python -c "import django; django.setup(); print('Django OK')" || {
              echo "❌ Django setup check failed. Dumping logs:"
              docker compose logs --tail=50 web
              exit 1
            }

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Backend deployment complete!"