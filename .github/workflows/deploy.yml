name: Deploy Backend to DigitalOcean VPS

on:
  push:
    branches:
      - prod-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -e

            echo "==> Pulling latest backend code..."
            cd ~/netily_cloud
            git fetch origin prod-backend
            git reset --hard origin/prod-backend

            echo "==> Rebuilding Django services..."
            cd docker
            docker compose build --no-cache web celery-worker celery-beat

            echo "==> Running database migrations..."
            docker compose run --rm web python manage.py migrate_schemas --shared
            docker compose run --rm web python manage.py migrate_schemas

            echo "==> Restarting Django services..."
            docker compose up -d web celery-worker celery-beat

            echo "==> Ensuring superadmin account exists..."
            docker compose exec -e SUPERADMIN_EMAIL="${{ secrets.SUPERADMIN_EMAIL }}" \
              -e SUPERADMIN_PASSWORD="${{ secrets.SUPERADMIN_PASSWORD }}" \
              web python manage.py ensure_superadmin

            echo "==> Collecting static files..."
            docker compose exec web python manage.py collectstatic --noinput || true

            echo "==> Cleaning up old Docker images..."
            docker image prune -f

            echo "==> Backend deployment complete!"