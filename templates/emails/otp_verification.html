<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Your verification code</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6;">
    <p>Hi {{ user.first_name|default:"there" }},</p>

    <p>Use the code below to complete <strong>{{ purpose }}</strong>:</p>

    <p style="font-size: 30px; letter-spacing: 5px; font-weight: bold; margin: 16px 0;">{{ otp_code }}</p>

    <p>This code expires in {{ expires_minutes }} minutes and can only be used once.</p>

    <p>If you did not request this code, ignore this email and secure your account.</p>

    <p>Netily Security</p>
</body>
</html>
