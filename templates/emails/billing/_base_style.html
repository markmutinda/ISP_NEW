{% comment %}
Shared inline styles for billing lifecycle emails.
Include via {% include "emails/billing/_base_style.html" %}
{% endcomment %}
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
  .wrapper { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .header { padding: 32px 40px 16px; }
  .header h1 { margin: 0; font-size: 22px; color: #111; }
  .header p { margin: 4px 0 0; font-size: 14px; color: #666; }
  .body { padding: 24px 40px; font-size: 15px; line-height: 1.7; color: #333; }
  .body p { margin: 0 0 16px; }
  .info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin: 20px 0; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #64748b; }
  .info-value { font-weight: 600; color: #111; }
  .highlight { background: #eff6ff; border: 1px solid #bfdbfe; padding: 16px; border-radius: 6px; margin: 20px 0; }
  .highlight.warning { background: #fef3c7; border-color: #fcd34d; }
  .highlight.danger { background: #fef2f2; border-color: #fecaca; }
  .highlight.success { background: #f0fdf4; border-color: #bbf7d0; }
  .btn { display: inline-block; padding: 12px 28px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; }
  .btn-danger { background: #dc2626; }
  .footer { padding: 24px 40px; background: #f8fafc; font-size: 12px; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; }
  .amount { font-size: 28px; font-weight: 700; color: #111; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-blue { background: #dbeafe; color: #1d4ed8; }
  .badge-red { background: #fee2e2; color: #dc2626; }
  .badge-green { background: #dcfce7; color: #16a34a; }
</style>
